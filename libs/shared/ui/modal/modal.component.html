@if (open) {
  <div class="ff-modal-layer">
    <div
      class="ff-modal-backdrop"
      role="button"
      tabindex="0"
      aria-label="Close dialog"
      (click)="backdropClick()"
      (keydown)="backdropKeydown($event)"
    ></div>

    <div
      #dialogPanel
      [class]="panelClasses"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="title ? titleId : null"
      (click)="stop($event)"
    >
      <div class="ff-modal-header">
        <div class="ff-modal-heading">
          @if (title) {
            <h3 class="ff-modal-title" [id]="titleId">{{ title }}</h3>
          }
        </div>

        <button
          type="button"
          class="ff-modal-close"
          aria-label="Close dialog"
          (click)="close()"
        >
          x
        </button>
      </div>

      <div class="ff-modal-body">
        <ng-content></ng-content>
      </div>

      <div class="ff-modal-actions">
        <ng-content select="[modal-actions]"></ng-content>
      </div>
    </div>
  </div>
}
